apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-app
  namespace: lab4-abhinav
  labels:
    managed-by: gitops-reconciler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-app
  template:
    metadata:
      labels:
        app: gitops-app
    spec:
      containers:
        - name: app
          image: devops-lab4-app:4.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: gitops-app-config
---
apiVersion: v1
kind: Service
metadata:
  name: gitops-app-svc
  namespace: lab4-abhinav
spec:
  selector:
    app: gitops-app
  ports:
    - port: 80
      targetPort: 5000
