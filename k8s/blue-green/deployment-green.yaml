apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-lab4-app-green
  namespace: lab4-abhinav
  labels:
    app: devops-lab4-app
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-lab4-app
      slot: green
  template:
    metadata:
      labels:
        app: devops-lab4-app
        slot: green
    spec:
      containers:
        - name: app
          image: devops-lab4-app:4.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "4.1.0"
            - name: DEPLOYMENT_SLOT
              value: "green"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 3
